<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Chemistry Lab</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #1b4332, #2d6a4f);
  color: white;
  text-align: center;
}

/* Header */
header {
  padding: 30px;
}

header h1 {
  font-size: 36px;
}

/* Card */
.card {
  background: white;
  color: black;
  width: 85%;
  max-width: 500px;
  margin: 30px auto;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 10px 20px rgba(0,0,0,0.4);
}

/* Button */
button {
  padding: 12px 20px;
  font-size: 18px;
  border: none;
  border-radius: 10px;
  background: #40916c;
  color: white;
  cursor: pointer;
  margin-top: 15px;
  transition: 0.3s;
}

button:hover {
  background: #1b4332;
  transform: scale(1.05);
}

/* Result */
#result {
  margin-top: 20px;
  font-size: 22px;
  color: #00ffcc;
}
</style>

</head>

<body>

<header>
  <h1>🧪 কেমিস্ট্রি ল্যাব</h1>
  <p>pH পরীক্ষা | অম্ল বা অ্যাসিড ও ক্ষার | রঙ পরিবর্তন</p>
</header>

<div class="card">

  <h2>🔬 pH এক্সপেরিমেন্ট</h2>

  <p>লিটমাস কাগজ ব্যবহার করে অ্যাসিড ও ক্ষার চেনা যায়</p>

  <button onclick="acidTest()">অ্যাসিড পরীক্ষা করো</button>
  <button onclick="baseTest()">ক্ষার পরীক্ষা করো</button>

  <div id="result"></div>

</div>

<script>
function acidTest() {
  document.getElementById("result").innerHTML =
  "🔴 অ্যাসিডিক পদার্থ (রং লাল হয়েছে)";
}

function baseTest() {
  document.getElementById("result").innerHTML =
  "🔵 ক্ষার জাতীয় পদার্থ (রং নীল হয়েছে)";
}
</script>

</body>
</html>
