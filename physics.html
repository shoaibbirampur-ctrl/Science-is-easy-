<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Physics Lab</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #141e30, #243b55);
  color: white;
  text-align: center;
}

/* Header */
header {
  padding: 30px;
}

header h1 {
  font-size: 36px;
}

/* Card */
.card {
  background: white;
  color: black;
  width: 80%;
  max-width: 500px;
  margin: 30px auto;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 10px 20px rgba(0,0,0,0.4);
}

/* Button */
button {
  padding: 12px 20px;
  font-size: 18px;
  border: none;
  border-radius: 10px;
  background: #00b4d8;
  color: white;
  cursor: pointer;
  margin-top: 15px;
  transition: 0.3s;
}

button:hover {
  background: #0077b6;
  transform: scale(1.05);
}

/* Result box */
#result {
  margin-top: 20px;
  font-size: 22px;
  color: #00ffcc;
}
</style>

</head>

<body>

<header>
  <h1>⚡ বিদ্যুৎ বর্তনী (Electric Circuit)</h1>
  <p>ব্যাটারি + তার + বাল্ব = আলো</p>
</header>

<div class="card">

  <h2>🔬 এক্সপেরিমেন্ট</h2>

  <p>সুইচ অন করলে বাল্ব জ্বলবে</p>

  <button onclick="startExperiment()">সুইচ অন করো</button>

  <div id="result"></div>

</div>

<script>
function startExperiment() {
  document.getElementById("result").innerHTML = "💡 বাল্ব জ্বলছে! কারেন্ট প্রবাহিত হচ্ছে";
}
</script>

</body>
</html>
